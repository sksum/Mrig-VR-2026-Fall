  <script>
    // ---- boot log relay: page-level errors + lifecycle -> server terminal ----
    (function bootRelay() {
      let ws = null;
      const queue = [];
      const flush = () => { while (queue.length) {
         const m = queue.shift();
         try { ws.send(JSON.stringify(m)); } catch (e) { queue.unshift(m); break; }
      } };
      const send = (tag, msg) => {
         queue.push({ type: 'log', tag: tag, msg: String(msg).slice(0, 300), ts: Date.now() });
         try {
            if (!ws || ws.readyState > 1) {
               ws = new WebSocket('wss://' + location.hostname + ':8447');
               ws.onopen = () => { queue.push({ type:'log', tag:'boot', msg:'boot relay connected', ts: Date.now() }); flush(); };
               ws.onclose = () => { ws = null; };
            } else if (ws.readyState === 1) flush();
         } catch (e) { /* best effort */ }
      };
      window.addEventListener('error', e =>
         send('boot-error', (e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)));
      console.warn = (orig => function(...a) { send('console-warn', a.join(' ')); orig.apply(console, a); })(console.warn);
      console.error = (orig => function(...a) { send('console-error', a.join(' ').slice(0, 300)); orig.apply(console, a); })(console.error);
      // relay tagged module logs (my modules log as "[tag] ...")
      console.log = (orig => function(...a) {
         const s = a.join(' ');
         if (s.startsWith('[')) send('console', s.slice(0, 300));
         orig.apply(console, a);
      })(console.log);
      // auto-start the sprites scene once it is registered (this page has no scene menu)
      (function start() {
         if (window.chooseFlag) {
            window.chooseFlag('sprites');
            if (window.currentName === 'sprites') { send('boot', 'sprites scene auto-started'); return; }
         }
         setTimeout(start, 250);
      })();
    })();
  </script>
